name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check the tag against the package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]

          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} must match the package version v{version}")
          PY

      - name: Build the source archive and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test the wheel and generate checksums
        run: |
          python -m venv "$RUNNER_TEMP/akko-release"
          "$RUNNER_TEMP/akko-release/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/akko-release/bin/akko-ctl" --help
          "$RUNNER_TEMP/akko-release/bin/akko-ctl" system super-fix > /dev/null
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.whl dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
